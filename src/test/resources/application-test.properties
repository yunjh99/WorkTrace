spring.datasource.url=jdbc:h2:mem:marketbot;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

external-api.connect-timeout=3s
external-api.read-timeout=5s

slack.bot.token=test-token
slack.signing-secret=test-signing-secret
slack.workspace=test-workspace
slack.digest.channel-id=test-channel

notion.token=test-token
notion.database.id=test-database
notion.version=2022-06-28
